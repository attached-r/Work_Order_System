server:  # 启动窗口 10001
  port: 10001

# 接口文档地址: http://localhost:10001/doc.html

spring:
  application:
    name: WorkOrderSystem
  # 配置mysql
  datasource:
    url: jdbc:mysql://localhost:3306/work_order_system
    username: root
    password: ${DB_PASSWORD:20050603RJ}
    # hikari:  连接池信息配置 暂时默认

  # 配置 Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:20050603RJ}
      database: 4
      timeout: 10000  #
  # 配置RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 5s
    # 生产者确认: correlated = 发 confirmation 并在 CorrelationData 上可取结果
    publisher-confirm-type: correlated
    # 不可路由的消息回退给发送方(配合 template.mandatory)
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ACK: 由消费端代码决定 ack/nack,不靠容器猜测
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 4
        # 重试耗尽后不无限 requeue,交给 DLX
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s
          max-retries: 3

# 异步通知(模块三):本机没有 broker 时把 enabled 置为 false 即可正常启动,
# 此时补偿任务把待发送消息留在 outbox(status=0),不做投递
mq:
  notify:
    enabled: true
    exchange: workorder.notify.exchange
    queue: workorder.notify.queue
    routing-key-prefix: workorder.notify.
    dead-letter-exchange: workorder.notify.dlx
    dead-letter-queue: workorder.notify.dlq
    dead-letter-routing-key: workorder.notify.dead
    confirm-timeout-seconds: 3
    compensation:
      enabled: true
      scan-delay-ms: 30000
      batch-size: 200
      max-retry: 5
      backoff-seconds: 30

# 分布式锁行为参数(模块四):wait/lease 是策略不是代码,集中在此便于调参
redis:
  lock:
    # 编号生成:临界区极短(INCR + 首次 EXPIRE)
    order-no-wait-seconds: 2
    order-no-lease-seconds: 5
    # 资源申请:锁内有一次 JOIN 校验 + 一次事务写入
    resource-wait-seconds: 3
    resource-lease-seconds: 10
    # 缓存重建:抢不到锁不阻塞,直接回源
    cache-rebuild-wait-seconds: 1
    cache-rebuild-lease-seconds: 5

# 缓存策略(模块四)
cache:
  workorder-detail:
    logical-ttl-seconds: 300     # 逻辑过期 5 分钟(到达后返回旧值 + 异步重建)
    physical-ttl-seconds: 1800   # 物理 TTL 30 分钟(仅兜底清场,必须 > 逻辑 TTL)
  absent-ttl-seconds: 60         # 穿透哨兵 60 秒(要短,避免「查不到」多存活)
  permission-tree-ttl-seconds: 1800   # 权限树字典 30 分钟(TTL-only)
  role-perms-ttl-seconds: 600         # 角色权限 10 分钟(写失效为主,TTL 兜底)
  rebuild-executor:
    core-size: 2
    max-size: 4
    queue-capacity: 256          # 满则丢弃 + warn(重建是可丢弃的优化)

# jwt配置
jwt:
  secret: iluhmq #签名密钥
  timeout: 7200  # 过期时间 7200s

# 密码哈希强度(BCrypt cost:合法 4-31,默认 10,生产建议 10-12)
password:
  bcrypt:
    strength: 10