server:  # 启动窗口 10001
  port: 10001

# 接口文档地址: http://localhost:10001/doc.html

spring:
  application:
    name: WorkOrderSystem
  # 配置mysql
  datasource:
    url: jdbc:mysql://localhost:3306/work_order_system
    username: root
    password: ${DB_PASSWORD:20050603RJ}
    # hikari:  连接池信息配置 暂时默认

  # 配置 Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:20050603RJ}
      database: 4
      timeout: 10000  #
  # 配置RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 5s
    # 生产者确认: correlated = 发 confirmation 并在 CorrelationData 上可取结果
    publisher-confirm-type: correlated
    # 不可路由的消息回退给发送方(配合 template.mandatory)
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ACK: 由消费端代码决定 ack/nack,不靠容器猜测
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 4
        # 重试耗尽后不无限 requeue,交给 DLX
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s
          max-retries: 3

# jwt配置
jwt:
  secret: iluhmq #签名密钥
  timeout: 7200  # 过期时间 7200s

# 密码哈希强度(BCrypt cost:合法 4-31,默认 10,生产建议 10-12)
password:
  bcrypt:
    strength: 10