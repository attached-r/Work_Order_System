# =============================================================================
# 本地开发基础设施：MySQL + Redis + RabbitMQ + Milvus
#
# 用法：
#   Copy-Item .env.example .env   # 首次
#   # 填好 .env 里的密码
#   docker compose up -d
#   docker compose ps
#
# 首次启动 MySQL 会自动执行：
#   01-schema.sql      项目一全库建表
#   02-data.sql        项目一演示数据（admin/admin123 等）
#   03-agent-schema.sql Agent 审计表
#
# 如果本机已经有 MySQL/Redis/RabbitMQ/Milvus 占用了端口，
# 不要再起同名服务，直接复用本机实例即可（见 README）。
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: workorder-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?please set DB_PASSWORD in .env}
      MYSQL_DATABASE: work_order_system
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/WorkOrderSystem/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/WorkOrderSystem/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./Agent/AgentWorkOrder/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/03-agent-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: workorder-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?please set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?please set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: workorder-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v3.0.3
    container_name: workorder-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      # 单容器内嵌 etcd + 本地存储，和本机当前可用的 Milvus 配置一致
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
      TZ: Asia/Shanghai
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  milvus-data:
