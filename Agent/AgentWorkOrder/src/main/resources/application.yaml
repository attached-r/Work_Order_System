server:
  port: 10002
# 接口文档地址: http://localhost:10002/swagger-ui/index.html

spring:
  application:
    name: AgentWorkOrder
  # M2：agent 自建审计库（只存「工具调用流水」这类非业务数据；业务事实仍以项目一为准）
  datasource:
    url: jdbc:mysql://localhost:3306/work_order_system
    username: root
    password: ${DB_PASSWORD:20050603RJ}         # 同项目一，用环境变量注入，避免明文入库
  # Redis：业务代码暂未使用（M5 才接入），这里先按本地环境配好连接参数；
  # database 用 5，避免与项目一（database 4）的键空间互相污染。
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:20050603RJ}
      database: 5
      timeout: 10000
  ai:
    model:
      # 用 provider 反向驱动 Spring AI 的模型选择器：
      #   provider=openai → 启用 OpenAI 的 Chat 自动配置（需要 API key）
      #   provider=mock   → 取值非 openai，Chat 自动配置不生效，无需 key 即可启动
      # （六个 OpenAI 自动配置都以 @ConditionalOnProperty(spring.ai.model.xxx=openai, matchIfMissing=true) 为条件，
      #  即默认全开，必须显式关掉用不到的，否则它们会因缺少 base-url / api-key 而在启动期报错）
      chat: ${agent.llm.provider}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${API_KEY:}
      # 默认走deepseek的 OpenAI 兼容端点
      base-url: ${BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${MODEL_NAME:deepseek-flash}

agent:
  llm:
    # mock=无需 key 跑通链路（默认）；openai=走真实大模型
    provider: openai
  workorder:
    # 项目一 service-workorder 的地址
    base-url: http://localhost:10001
  audit:
    # 审计写入开关：关掉可短路埋点（压测时用），默认开启
    enabled: true
    # 返回体摘要截断长度（对齐 result_excerpt 列宽 512）
    excerpt-max-length: 512
  perm:
    # 用户 perms 的进程内缓存时长（秒）；改权限后要等它过期才生效，故不宜过长
    cache-ttl-seconds: 60

  rag:
    enabled: true
    # simple=单文件零中间件；milvus=本地 Docker Desktop（19530、无鉴权）
    store: milvus
    knowledge-locations: classpath*:knowledge/*.md

    # 检索参数
    top-k: 4                 # 每次给模型 4 个片段，避免挤占上下文
    max-top-k: 8             # 模型传再大也只取 8
    similarity-threshold: 0.35
    max-content-chars: 1200  # 单片段正文截断

    # 切片参数
    chunk-size: 400
    min-chunk-size-chars: 120

    # 入库与索引
    ingest-on-startup: if-empty      # if-empty | always | never
    manifest-path: ./data/rag-manifest.json
    simple:
      file: ./data/rag-simple-store.json

    embedding:
      # mock=无 key 冒烟；openai=OpenAI 兼容的 embedding 服务
      provider: openai
      # 注意：Spring AI 会在 base-url 后自动追加 /v1/embeddings，故这里不能带 /v1
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:BAAI/bge-m3}
      dimensions: 1024
      # bge-m3 维度固定，部分兼容服务不接受 dimensions 参数，默认不发送
      request-dimensions: false

    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}     # Docker 默认 gRPC 端口
      database: default
      collection: agent_knowledge
      metric-type: COSINE             # 文本 embedding 常用度量，分数越大越相似
      index-type: IVF_FLAT            # 中小规模知识库：构建快、召回稳定

# MyBatis-Plus：列名下划线 → 实体 camelCase 自动映射；主键自增
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
